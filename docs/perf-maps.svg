<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 400" width="1260" height="400" role="img" aria-labelledby="t d">
<title id="t">Size vs runtime cost of the shader solutions</title>
<desc id="d">Three scatter plots of size added vs idle CPU usage: web (Chromium), iOS (iPhone 13) and Android (Galaxy S21 Ultra at 60 Hz).</desc>
<style>
.bg{fill:#fcfcfb} .t1{font:600 15px system-ui,sans-serif;fill:#0b0b0b} .t2,.lab{font:12px system-ui,sans-serif;fill:#52514e}
.tick{font:11px system-ui,sans-serif;fill:#898781;font-variant-numeric:tabular-nums} .grid{stroke:#e1e0d9;stroke-width:1} .axis{stroke:#c3c2b7;stroke-width:1}
.dot{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2} .hit{fill:transparent} .pl{font:600 12px system-ui,sans-serif;fill:#0b0b0b} .leader{stroke:#898781;stroke-width:1} .ideal{font:italic 12px system-ui,sans-serif;fill:#898781}
@media (prefers-color-scheme: dark){ .bg{fill:#1a1a19} .t1,.pl{fill:#ffffff} .t2,.lab{fill:#c3c2b7} .grid{stroke:#2c2c2a} .axis{stroke:#383835} .dot{fill:#3987e5;stroke:#1a1a19} }
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<g>
<text class="t1" x="64" y="26">Web: size vs CPU</text>
<text class="t2" x="64" y="44">effect idle, 1280x800; down-left is ideal</text>
<line class="grid" x1="64" x2="396" y1="342.0" y2="342.0"/>
<text class="tick" x="56" y="346.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="396" y1="272.5" y2="272.5"/>
<text class="tick" x="56" y="276.5" text-anchor="end">10</text>
<line class="grid" x1="64" x2="396" y1="203.0" y2="203.0"/>
<text class="tick" x="56" y="207.0" text-anchor="end">20</text>
<line class="grid" x1="64" x2="396" y1="133.5" y2="133.5"/>
<text class="tick" x="56" y="137.5" text-anchor="end">30</text>
<line class="grid" x1="64" x2="396" y1="64.0" y2="64.0"/>
<text class="tick" x="56" y="68.0" text-anchor="end">40</text>
<text class="tick" x="64.0" y="360" text-anchor="middle">1 kB</text>
<text class="tick" x="147.0" y="360" text-anchor="middle">10 kB</text>
<text class="tick" x="230.0" y="360" text-anchor="middle">100 kB</text>
<text class="tick" x="313.0" y="360" text-anchor="middle">1 MB</text>
<text class="tick" x="396.0" y="360" text-anchor="middle">10 MB</text>
<line class="axis" x1="64" x2="396" y1="342" y2="342"/>
<text class="lab" x="230.0" y="386" text-anchor="middle">bundle added (gzip, log scale)</text>
<text class="lab" transform="translate(18,203.0) rotate(-90)" text-anchor="middle">CPU % (Chromium, all processes)</text>
<text class="ideal" x="390.0" y="334.0" text-anchor="end"></text>
<g><title>WebGL: +4.2 kB, 23.2 % CPU (26.0 % at 2560x1600)</title><circle class="hit" cx="115.7" cy="180.8" r="12"/><circle class="dot" cx="115.7" cy="180.8" r="6"/></g>
<text class="pl" x="125.7" y="194.8" text-anchor="start">WebGL</text>
<g><title>WebGPU: +3.5 kB, 30.2 % CPU (36.5 % at 2560x1600)</title><circle class="hit" cx="109.2" cy="132.1" r="12"/><circle class="dot" cx="109.2" cy="132.1" r="6"/></g>
<text class="pl" x="99.2" y="122.1" text-anchor="end">WebGPU</text>
<g><title>gl-react: +38.4 kB, 28.9 % CPU (29.2 % at 2560x1600)</title><circle class="hit" cx="195.5" cy="141.1" r="12"/><circle class="dot" cx="195.5" cy="141.1" r="6"/></g>
<text class="pl" x="195.5" y="127.1" text-anchor="middle">gl-react</text>
<g><title>CanvasKit: +3.0 MB, 27.2 % CPU (28.2 % at 2560x1600)</title><circle class="hit" cx="352.6" cy="153.0" r="12"/><circle class="dot" cx="352.6" cy="153.0" r="6"/></g>
<text class="pl" x="342.6" y="171.0" text-anchor="end">CanvasKit</text>
</g>
<g>
<text class="t1" x="484" y="26">iOS: size vs CPU</text>
<text class="t2" x="484" y="44">iPhone 13, app process; down-left is ideal</text>
<line class="grid" x1="484" x2="816" y1="342.0" y2="342.0"/>
<text class="tick" x="476" y="346.0" text-anchor="end">0</text>
<line class="grid" x1="484" x2="816" y1="249.3" y2="249.3"/>
<text class="tick" x="476" y="253.3" text-anchor="end">10</text>
<line class="grid" x1="484" x2="816" y1="156.7" y2="156.7"/>
<text class="tick" x="476" y="160.7" text-anchor="end">20</text>
<line class="grid" x1="484" x2="816" y1="64.0" y2="64.0"/>
<text class="tick" x="476" y="68.0" text-anchor="end">30</text>
<text class="tick" x="484.0" y="360" text-anchor="middle">0</text>
<text class="tick" x="567.0" y="360" text-anchor="middle">5</text>
<text class="tick" x="650.0" y="360" text-anchor="middle">10</text>
<text class="tick" x="733.0" y="360" text-anchor="middle">15</text>
<text class="tick" x="816.0" y="360" text-anchor="middle">20</text>
<line class="axis" x1="484" x2="816" y1="342" y2="342"/>
<text class="lab" x="650.0" y="386" text-anchor="middle">iOS .app size added, arm64 (MB)</text>
<text class="lab" transform="translate(438,203.0) rotate(-90)" text-anchor="middle">CPU % of one core (iPhone 13)</text>
<text class="ideal" x="810.0" y="334.0" text-anchor="end"></text>
<line class="leader" x1="485.2" y1="192.8" x2="521.5" y2="250.0"/>
<text class="pl" x="525.5" y="254.0" text-anchor="start">native (Metal)</text>
<g><title>native (Metal): +0.07 MB, 16.1 % CPU (iPhone 13)</title><circle class="hit" cx="485.2" cy="192.8" r="12"/><circle class="dot" cx="485.2" cy="192.8" r="6"/></g>
<line class="leader" x1="485.3" y1="191.0" x2="521.5" y2="217.5"/>
<text class="pl" x="525.5" y="221.5" text-anchor="start">native-compatible-static</text>
<g><title>native-compatible-static: +0.08 MB, 16.3 % CPU (iPhone 13)</title><circle class="hit" cx="485.3" cy="191.0" r="12"/><circle class="dot" cx="485.3" cy="191.0" r="6"/></g>
<line class="leader" x1="485.5" y1="196.5" x2="521.5" y2="282.4"/>
<text class="pl" x="525.5" y="286.4" text-anchor="start">native-compatible-dynamic</text>
<g><title>native-compatible-dynamic: +0.09 MB, 15.7 % CPU (iPhone 13)</title><circle class="hit" cx="485.5" cy="196.5" r="12"/><circle class="dot" cx="485.5" cy="196.5" r="6"/></g>
<g><title>gl-react-expo: +6.8 MB, 19.3 % CPU (iPhone 13; 3x + MSAA, 192 MB)</title><circle class="hit" cx="596.9" cy="163.2" r="12"/><circle class="dot" cx="596.9" cy="163.2" r="6"/></g>
<text class="pl" x="596.9" y="151.2" text-anchor="middle">gl-react-expo</text>
<g><title>RN WebGPU: +10.4 MB, 21.3 % CPU (iPhone 13)</title><circle class="hit" cx="656.6" cy="144.6" r="12"/><circle class="dot" cx="656.6" cy="144.6" r="6"/></g>
<text class="pl" x="656.6" y="132.6" text-anchor="middle">RN WebGPU</text>
<g><title>RN Skia: +17.1 MB, 20.1 % CPU (iPhone 13, renders at 3x)</title><circle class="hit" cx="767.9" cy="155.7" r="12"/><circle class="dot" cx="767.9" cy="155.7" r="6"/></g>
<text class="pl" x="757.9" y="173.7" text-anchor="end">RN Skia</text>
</g>
<g>
<text class="t1" x="904" y="26">Android: size vs CPU</text>
<text class="t2" x="904" y="44">Galaxy S21 Ultra at 60 Hz, app process; down-left is ideal</text>
<line class="grid" x1="904" x2="1236" y1="342.0" y2="342.0"/>
<text class="tick" x="896" y="346.0" text-anchor="end">0</text>
<line class="grid" x1="904" x2="1236" y1="272.5" y2="272.5"/>
<text class="tick" x="896" y="276.5" text-anchor="end">20</text>
<line class="grid" x1="904" x2="1236" y1="203.0" y2="203.0"/>
<text class="tick" x="896" y="207.0" text-anchor="end">40</text>
<line class="grid" x1="904" x2="1236" y1="133.5" y2="133.5"/>
<text class="tick" x="896" y="137.5" text-anchor="end">60</text>
<line class="grid" x1="904" x2="1236" y1="64.0" y2="64.0"/>
<text class="tick" x="896" y="68.0" text-anchor="end">80</text>
<text class="tick" x="904.0" y="360" text-anchor="middle">0</text>
<text class="tick" x="970.4" y="360" text-anchor="middle">5</text>
<text class="tick" x="1036.8" y="360" text-anchor="middle">10</text>
<text class="tick" x="1103.2" y="360" text-anchor="middle">15</text>
<text class="tick" x="1169.6" y="360" text-anchor="middle">20</text>
<text class="tick" x="1236.0" y="360" text-anchor="middle">25</text>
<line class="axis" x1="904" x2="1236" y1="342" y2="342"/>
<text class="lab" x="1070.0" y="386" text-anchor="middle">APK size added, arm64 (MB)</text>
<text class="lab" transform="translate(858,203.0) rotate(-90)" text-anchor="middle">CPU % of one core (S21 Ultra)</text>
<text class="ideal" x="1230.0" y="334.0" text-anchor="end"></text>
<line class="leader" x1="904.7" y1="202.7" x2="939.8" y2="223.3"/>
<text class="pl" x="943.8" y="227.3" text-anchor="start">native (AGSL)</text>
<g><title>native (AGSL): ~+0.05 MB arm64, 40.1 % CPU (S21 Ultra, 60 Hz)</title><circle class="hit" cx="904.7" cy="202.7" r="12"/><circle class="dot" cx="904.7" cy="202.7" r="6"/></g>
<line class="leader" x1="904.8" y1="170.3" x2="939.8" y2="139.9"/>
<text class="pl" x="943.8" y="143.9" text-anchor="start">native-compatible-static</text>
<g><title>native-compatible-static: ~+0.06 MB arm64, 49.4 % CPU (S21 Ultra, 60 Hz)</title><circle class="hit" cx="904.8" cy="170.3" r="12"/><circle class="dot" cx="904.8" cy="170.3" r="6"/></g>
<line class="leader" x1="905.2" y1="169.3" x2="939.8" y2="181.6"/>
<text class="pl" x="943.8" y="185.6" text-anchor="start">native-compatible-dynamic</text>
<g><title>native-compatible-dynamic: ~+0.09 MB arm64, 49.7 % CPU (S21 Ultra, 60 Hz)</title><circle class="hit" cx="905.2" cy="169.3" r="12"/><circle class="dot" cx="905.2" cy="169.3" r="6"/></g>
<g><title>gl-react-expo: +7.4 MB arm64, 69.0 % CPU (S21 Ultra, 60 Hz)</title><circle class="hit" cx="1002.3" cy="102.2" r="12"/><circle class="dot" cx="1002.3" cy="102.2" r="6"/></g>
<text class="pl" x="1002.3" y="90.2" text-anchor="middle">gl-react-expo</text>
<g><title>RN Skia: +14.6 MB arm64, 26.5 % CPU (S21 Ultra, 60 Hz)</title><circle class="hit" cx="1097.9" cy="249.9" r="12"/><circle class="dot" cx="1097.9" cy="249.9" r="6"/></g>
<text class="pl" x="1097.9" y="267.9" text-anchor="middle">RN Skia</text>
<g><title>RN WebGPU: +19.6 MB arm64, 27.9 % CPU (S21 Ultra, 60 Hz)</title><circle class="hit" cx="1164.3" cy="245.0" r="12"/><circle class="dot" cx="1164.3" cy="245.0" r="6"/></g>
<text class="pl" x="1164.3" y="233.0" text-anchor="middle">RN WebGPU</text>
</g>
</svg>