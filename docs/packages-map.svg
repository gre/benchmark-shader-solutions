<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" aria-labelledby="t d">
<title id="t">Packages: who pays the cost?</title>
<desc id="d">Scatter plot of the universal packages: extra steps the app must take to use the package vs code the package author maintains. The three native packages need no extra step but 920 to 1280 lines; skia 4 steps and 280 lines; webgpu 7 and 470; gl-react 9 and 240.</desc>
<style>
.bg{fill:#fcfcfb} .t1{font:600 15px system-ui,sans-serif;fill:#0b0b0b} .t2,.lab{font:12px system-ui,sans-serif;fill:#52514e}
.tick{font:11px system-ui,sans-serif;fill:#898781;font-variant-numeric:tabular-nums} .grid{stroke:#e1e0d9;stroke-width:1} .axis{stroke:#c3c2b7;stroke-width:1}
.dot{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2} .hit{fill:transparent} .pl{font:600 12px system-ui,sans-serif;fill:#0b0b0b} .ideal{font:italic 12px system-ui,sans-serif;fill:#898781}
@media (prefers-color-scheme: dark){ .bg{fill:#1a1a19} .t1,.pl{fill:#ffffff} .t2,.lab{fill:#c3c2b7} .grid{stroke:#2c2c2a} .axis{stroke:#383835} .dot{fill:#3987e5;stroke:#1a1a19} }
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<g>
<text class="t1" x="64" y="26">Packages: who pays the cost?</text>
<text class="t2" x="64" y="44">effort for the app vs effort for the author; down-left is ideal</text>
<line class="grid" x1="64" x2="396" y1="342.0" y2="342.0"/>
<text class="tick" x="56" y="346.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="396" y1="272.5" y2="272.5"/>
<text class="tick" x="56" y="276.5" text-anchor="end">350</text>
<line class="grid" x1="64" x2="396" y1="203.0" y2="203.0"/>
<text class="tick" x="56" y="207.0" text-anchor="end">700</text>
<line class="grid" x1="64" x2="396" y1="133.5" y2="133.5"/>
<text class="tick" x="56" y="137.5" text-anchor="end">1050</text>
<line class="grid" x1="64" x2="396" y1="64.0" y2="64.0"/>
<text class="tick" x="56" y="68.0" text-anchor="end">1400</text>
<text class="tick" x="64.0" y="360" text-anchor="middle">0</text>
<text class="tick" x="130.4" y="360" text-anchor="middle">2</text>
<text class="tick" x="196.8" y="360" text-anchor="middle">4</text>
<text class="tick" x="263.2" y="360" text-anchor="middle">6</text>
<text class="tick" x="329.6" y="360" text-anchor="middle">8</text>
<text class="tick" x="396.0" y="360" text-anchor="middle">10</text>
<line class="axis" x1="64" x2="396" y1="342" y2="342"/>
<text class="lab" x="230.0" y="386" text-anchor="middle">extra steps for the app</text>
<text class="lab" transform="translate(18,203.0) rotate(-90)" text-anchor="middle">code the package author maintains (lines)</text>
<text class="ideal" x="70.0" y="334.0" text-anchor="start"></text>
<g><title>native: 0 extra steps for the app, ~920 lines of code to maintain</title><circle class="hit" cx="64.0" cy="159.3" r="12"/><circle class="dot" cx="64.0" cy="159.3" r="6"/></g>
<text class="pl" x="74.0" y="163.3" text-anchor="start">native (AGSL)</text>
<g><title>native-compatible-static: 0 extra steps for the app, ~1175 lines of code to maintain</title><circle class="hit" cx="64.0" cy="108.7" r="12"/><circle class="dot" cx="64.0" cy="108.7" r="6"/></g>
<text class="pl" x="74.0" y="122.7" text-anchor="start">native-compatible-static</text>
<g><title>native-compatible-dynamic: 0 extra steps for the app, ~1280 lines of code to maintain</title><circle class="hit" cx="64.0" cy="87.8" r="12"/><circle class="dot" cx="64.0" cy="87.8" r="6"/></g>
<text class="pl" x="74.0" y="81.8" text-anchor="start">native-compatible-dynamic</text>
<g><title>skia: 4 extra steps for the app, ~280 lines of code to maintain</title><circle class="hit" cx="196.8" cy="286.4" r="12"/><circle class="dot" cx="196.8" cy="286.4" r="6"/></g>
<text class="pl" x="196.8" y="272.4" text-anchor="middle">skia</text>
<g><title>webgpu: 7 extra steps for the app, ~470 lines of code to maintain</title><circle class="hit" cx="296.4" cy="248.7" r="12"/><circle class="dot" cx="296.4" cy="248.7" r="6"/></g>
<text class="pl" x="296.4" y="234.7" text-anchor="middle">webgpu</text>
<g><title>gl-react: 9 extra steps for the app, ~240 lines of code to maintain</title><circle class="hit" cx="362.8" cy="294.3" r="12"/><circle class="dot" cx="362.8" cy="294.3" r="6"/></g>
<text class="pl" x="352.8" y="316.3" text-anchor="end">gl-react</text>
</g>
</svg>