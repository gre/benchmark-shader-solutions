// @shader-bench/native-compatible-static — Android library module (autolinked
// by the React Native CLI: android/ + a ReactPackage, codegen from
// package.json codegenConfig via the com.facebook.react plugin).
//
// Shaders: every ../src/shaders/<name>/<name>.glsl.ts (the web's GLSL ES 1.00
// source, one template literal) is extracted at build time into the
// generated assets dir as assets/shader-bench-compat-static/<name>.glsl. The
// view loads the asset of its `shader` prop and compiles it with OpenGL ES
// 2.0, so the JS bundle carries no GLSL. Editing a shader = Android rebuild.
//
// Floor: minSdk 25 (Android 7.1), tested on API 25 and 34; uses only
// EGL14 / GLES20 / TextureView (all API <= 17).

buildscript {
  repositories {
    google()
    mavenCentral()
  }
}

def safeExtGet(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def shaderAssets = layout.buildDirectory.dir("generated/shader-bench-compat-static/assets")
def glslSources = fileTree("${projectDir}/../src/shaders") { include "*/*.glsl.ts" }

// <name>.glsl.ts holds `const X = \`...\`; export default X;`: the asset is
// the text between the first and the last backtick. Interpolations, escapes
// or several literals would make the asset differ from the JS string: fail.
def extractGlsl = tasks.register("extractShaderBenchCompatStaticGlsl") {
  def outRoot = shaderAssets.get().asFile
  inputs.files(glslSources)
  outputs.dir(outRoot)
  doLast {
    def out = new File(outRoot, "shader-bench-compat-static")
    out.deleteDir()
    out.mkdirs()
    glslSources.files.each { File f ->
      def text = f.getText("UTF-8")
      int a = text.indexOf("`")
      int b = text.lastIndexOf("`")
      def body = (a >= 0 && b > a) ? text.substring(a + 1, b) : null
      if (body == null || body.contains("`") || body.contains('${') || body.contains("\\")) {
        throw new GradleException("${f}: expected one plain template literal (no backtick, \${ or backslash inside)")
      }
      new File(out, f.name - ".glsl.ts" + ".glsl").setText(body, "UTF-8")
    }
  }
}

android {
  namespace "com.shaderbench.compatstatic"
  compileSdk safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion 25
  }

  sourceSets {
    main {
      assets.srcDirs += [shaderAssets.get().asFile]
    }
  }
}

preBuild.dependsOn(extractGlsl)

dependencies {
  implementation("com.facebook.react:react-android")
}
